  #pv-preloader{
    position:fixed; inset:0; z-index:99999;
    background:var(--pv-bg);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .6s ease, visibility 0s linear .6s;

  @media (max-aspect-ratio:1/1){ .pv-logo{ width:72vw; } }

  .pv-logo img{ display:block; width:100%; height:100%; user-select:none; -webkit-user-drag:none; }

<!-- ===================== YOUR WEBSITE (demo) ===================== -->
<main class="demo">
  <div>
    <h1>Welcome to Pivilis</h1>
    <p>Your website content appears here once the preloader finishes.</p>
    <button id="replay">Replay preloader</button>
  </div>
</main>

<!-- ===================== PIVILIS PRELOADER · SCRIPT ===================== -->
<script>
(function(){
  var pre   = document.getElementById('pv-preloader');
  var stage = pre.querySelector('.pv-stage');
  var logo  = pre.querySelector('.pv-logo');
  var acc   = pre.querySelector('.pv-accent');
  var dot   = pre.querySelector('.pv-dot');

  /* Timeline (seconds), measured frame-by-frame from the video:
     0.00-0.80  logo fades in
     0.95-1.57  orange accent grows inside the P
     ~2.7-3.5   orange dot flies in from the right, arcs over the text, shrinks + squashes
     3.5-4.5    dot bounces and settles above the 4th letter
     5.00-6.00  logo zooms slightly and fades out
     6.00-6.60  preloader background fades to reveal the page                         */
  var HOLD_AT = 5.0, END_AT = 6.0;

  /* dot keyframes: [time, centreX, centreY, width, height] in units of logo width */
  var KEYS = [[2.767,1.372,0.1491,0.1055,0.1055],[2.8,1.3257,0.1491,0.1055,0.1055],[2.833,1.2791,0.1491,0.1055,0.1055],[2.867,1.2325,0.1479,0.1055,0.108],[2.9,1.1834,0.1479,0.1055,0.108],[2.933,1.1834,0.1479,0.1055,0.108],[2.967,1.1368,0.1479,0.1055,0.108],[3.0,1.0877,0.1485,0.1055,0.1067],[3.033,1.046,0.1074,0.1055,0.1055],[3.067,1.0031,0.0706,0.1031,0.1055],[3.1,1.0031,0.0706,0.1031,0.1055],[3.133,0.9581,0.038,0.1031,0.1018],[3.167,0.913,0.0129,0.1031,0.1031],[3.2,0.8667,-0.0067,0.1006,0.1031],[3.233,0.8667,-0.0067,0.1006,0.1031],[3.267,0.8192,-0.0227,0.1006,0.1006],[3.3,0.7754,-0.0325,0.0982,0.1006],[3.333,0.7278,-0.0368,0.0982,0.0994],[3.367,0.6815,-0.0362,0.0957,0.0982],[3.4,0.6395,-0.0264,0.0871,0.0883],[3.467,0.612,0.012,0.075,0.075],[3.5,0.5953,0.055,0.0646,0.0646],[3.567,0.5953,0.04,0.0646,0.0646],[3.633,0.5953,0.026,0.0646,0.0646],[3.7,0.5953,0.018,0.0646,0.0646],[3.8,0.5953,0.02,0.0646,0.0646],[3.9,0.5953,0.034,0.0646,0.0646],[4.0,0.5953,0.052,0.0646,0.0646],[4.07,0.5953,0.06,0.0646,0.0646],[4.13,0.5953,0.0555,0.0646,0.0646],[4.2,0.5953,0.056,0.0646,0.0646],[5.0,0.5953,0.056,0.0646,0.0646]];

  var W = logo.offsetWidth, vw = innerWidth, left = logo.getBoundingClientRect().left;
  function measure(){ W = logo.offsetWidth; vw = innerWidth; left = logo.getBoundingClientRect().left; buildKeys(); }

  var keys = KEYS;
  function buildKeys(){
    /* make sure the dot always starts outside the viewport, at the same speed as the video */
    var R = (vw - left) / W + 0.12, k0 = KEYS[0];
    if (R > k0[1]) {
      var dt = (R - k0[1]) / 1.4;
      keys = [[k0[0]-dt, R, k0[2], k0[3], k0[4]]].concat(KEYS);
    } else keys = KEYS;
  }
  buildKeys();
  addEventListener('resize', measure);

  var clamp = function(v,a,b){ return Math.max(a, Math.min(b, v)); };

  function render(t){
    /* stage opacity + exit zoom */
    var op = clamp((t-0.07)/0.78, 0, 1);
    var sc = 1;
    if (t > HOLD_AT) {
      sc = 1 + 0.13 * Math.pow(clamp((t-HOLD_AT)/0.95, 0, 1), 1.5);
      op *= 1 - clamp((t-5.1)/0.9, 0, 1);
    }
    stage.style.opacity = op;
    stage.style.transform = 'scale(' + sc + ')';

    /* orange accent wipe (bottom-left -> top-right) */
    var p = clamp((t-0.95)/0.62, 0, 1), e = 1 - Math.pow(1-p, 2.2);
    acc.style.clipPath = 'ellipse(' + (150*Math.pow(e,1.3)).toFixed(1) + '% ' + (150*e).toFixed(1) + '% at 0% 100%)';

    /* flying dot */
    if (t < keys[0][0]) { dot.style.visibility = 'hidden'; return; }
    var i = 0, n = keys.length;
    while (i < n-2 && keys[i+1][0] <= t) i++;
    var a = keys[i], b = keys[Math.min(i+1, n-1)];
    var f = (b[0] === a[0]) ? 1 : clamp((t-a[0])/(b[0]-a[0]), 0, 1);
    var x = a[1]+(b[1]-a[1])*f, y = a[2]+(b[2]-a[2])*f,
        w = a[3]+(b[3]-a[3])*f, h = a[4]+(b[4]-a[4])*f;
    dot.style.visibility = 'visible';
    dot.style.width  = (w*W) + 'px';
    dot.style.height = (h*W) + 'px';
    dot.style.transform = 'translate3d(' + (x*W - w*W/2) + 'px,' + (y*W - h*W/2) + 'px,0)';
  }

  var loaded = document.readyState === 'complete', raf, last, t, running = false;
  addEventListener('load', function(){ loaded = true; });

  function finish(){
    pre.classList.add('pv-out');
    document.documentElement.classList.remove('pv-lock');
    setTimeout(function(){ pre.style.display = 'none';
      document.dispatchEvent(new CustomEvent('pivilis:preloader-done')); }, 650);
  }

  function frame(now){
    var dt = Math.min((now-last)/1000, 0.1); last = now;
    /* hold the finished logo (before the exit) until the page has fully loaded */
    t += dt;
    if (!loaded && t > HOLD_AT) t = HOLD_AT;
    render(t);
    if (t >= END_AT) { running = false; finish(); return; }
    raf = requestAnimationFrame(frame);
  }

  function play(){
    cancelAnimationFrame(raf);
    pre.style.display = ''; pre.classList.remove('pv-out');
    document.documentElement.classList.add('pv-lock');
    stage.style.transform = 'none';
    measure(); t = 0; running = true; render(0);
    last = performance.now(); raf = requestAnimationFrame(frame);
  }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    /* accessibility: skip the motion, just show the static logo briefly */
    render(4.9); setTimeout(finish, 800);
  } else play();

  /* demo only: replay button + public API */
  var rb = document.getElementById('replay');
  if (rb) rb.addEventListener('click', function(){ loaded = true; play(); });
  window.PivilisPreloader = {
    replay: function(){ loaded = true; play(); },
    seek: function(s){ cancelAnimationFrame(raf); pre.style.display=''; pre.classList.remove('pv-out'); stage.style.transform='none'; measure(); render(s); } /* debug helper */
  };
})();
</script>
